name: Build Android APK

on:
  push:
    branches: [godot-3d]
    paths:
      - "godot/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Export Godot Android APK
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Prepare Android SDK
        env:
          HOME: /root
          ANDROID_HOME: /usr/lib/android-sdk
          ANDROID_SDK_ROOT: /usr/lib/android-sdk
        run: |
          set -eux
          java -version
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses
          # Godot 4.3 requires this NDK version for its Android export pipeline.
          sdkmanager --sdk_root="$ANDROID_HOME" --install "platform-tools" "build-tools;34.0.0" "platforms;android-34" "ndk;23.2.8568313"
          test -x "$ANDROID_HOME/build-tools/34.0.0/aapt"
          test -x "$ANDROID_HOME/build-tools/34.0.0/zipalign"
          test -x "$ANDROID_HOME/build-tools/34.0.0/apksigner"
          test -f "$ANDROID_HOME/platforms/android-34/android.jar"
          test -d "$ANDROID_HOME/ndk/23.2.8568313"
          sdkmanager --sdk_root="$ANDROID_HOME" --list_installed

      - name: Configure Godot Android paths and debug signing
        env:
          HOME: /root
          ANDROID_HOME: /usr/lib/android-sdk
          ANDROID_SDK_ROOT: /usr/lib/android-sdk
        run: |
          set -eux
          mkdir -p /root/.config/godot /root/.android
          if [ ! -s /root/.android/debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore /root/.android/debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA -keysize 2048 -validity 10000
          fi
          cat > /root/.config/godot/editor_settings-4.3.tres <<'EOF'
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "/usr/lib/android-sdk"
          export/android/java_sdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"
          export/android/debug_keystore = "/root/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          test -d /root/.local/share/godot/export_templates/4.3.stable
          test -d /usr/lib/jvm/java-17-openjdk-amd64
          test -d /usr/lib/android-sdk/ndk/23.2.8568313
          test -x /usr/lib/android-sdk/build-tools/34.0.0/aapt
          test -x /usr/lib/android-sdk/build-tools/34.0.0/zipalign
          test -x /usr/lib/android-sdk/build-tools/34.0.0/apksigner
          test -f /usr/lib/android-sdk/platforms/android-34/android.jar
          test -s /root/.android/debug.keystore

      - name: Import project resources
        env:
          HOME: /root
          ANDROID_HOME: /usr/lib/android-sdk
          ANDROID_SDK_ROOT: /usr/lib/android-sdk
        run: godot --headless --path godot --editor --quit

      - name: Build APK
        env:
          HOME: /root
          ANDROID_HOME: /usr/lib/android-sdk
          ANDROID_SDK_ROOT: /usr/lib/android-sdk
        run: |
          mkdir -p build/android
          godot --headless --verbose --path godot --export-debug "Android" ../build/android/MouhFail.apk
          test -s build/android/MouhFail.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mouh-Fail-Android-APK
          path: build/android/MouhFail.apk
          if-no-files-found: error
          retention-days: 14
