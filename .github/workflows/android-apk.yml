name: Build Android APK

on:
  push:
    branches: [godot-3d]
    paths:
      - "godot/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Export Godot Android APK
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Prepare Godot export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/
          mkdir -p ~/.config/
          mkdir -p "$HOME/.config/godot"
          mkdir -p "$HOME/.local/share/godot/export_templates"
          if [ "$HOME" != "/root" ] && [ -d /root/.config/godot ]; then
            cp -a /root/.config/godot/. "$HOME/.config/godot/"
          fi
          if [ "$HOME" != "/root" ]; then
            cp -a /root/.local/share/godot/export_templates/4.3.stable "$HOME/.local/share/godot/export_templates/4.3.stable"
          fi
          SETTINGS="$HOME/.config/godot/editor_settings-4.3.tres"
          touch "$SETTINGS"
          grep -q 'export/android/java_sdk_path' "$SETTINGS" || echo 'export/android/java_sdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"' >> "$SETTINGS"
          grep -q 'export/android/android_sdk_path' "$SETTINGS" || echo 'export/android/android_sdk_path = "/usr/lib/android-sdk"' >> "$SETTINGS"
          grep -q 'export/android/debug_keystore' "$SETTINGS" || echo 'export/android/debug_keystore = "/root/debug.keystore"' >> "$SETTINGS"
          grep -q 'export/android/debug_keystore_user' "$SETTINGS" || echo 'export/android/debug_keystore_user = "androiddebugkey"' >> "$SETTINGS"
          grep -q 'export/android/debug_keystore_pass' "$SETTINGS" || echo 'export/android/debug_keystore_pass = "android"' >> "$SETTINGS"
          grep -q 'export/android/force_system_user' "$SETTINGS" || echo 'export/android/force_system_user = false' >> "$SETTINGS"

      - name: Import project resources
        run: godot --headless --path godot --editor --quit

      - name: Build APK
        run: |
          mkdir -p build/android
          godot --headless --verbose --path godot --export-debug "Android" ../build/android/MouhFail.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mouh-Fail-Android-APK
          path: build/android/MouhFail.apk
          if-no-files-found: error
          retention-days: 14
