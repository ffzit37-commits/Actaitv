name: Build Android APK

on:
  push:
    branches: [godot-3d]
    paths:
      - "godot/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Export Godot Android APK
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Prepare Godot export environment
        env:
          HOME: /root
        run: |
          test -d /root/.config/godot
          test -d /root/.local/share/godot/export_templates/4.3.stable
          echo "Using the preconfigured Godot Android environment from the CI image."
          echo "Java: $(command -v java)"
          echo "Android SDK: ${ANDROID_HOME:-${ANDROID_SDK_ROOT:-not-set}}"

      - name: Import project resources
        env:
          HOME: /root
        run: godot --headless --path godot --editor --quit

      - name: Build APK
        env:
          HOME: /root
        run: |
          mkdir -p build/android
          godot --headless --verbose --path godot --export-debug "Android" ../build/android/MouhFail.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mouh-Fail-Android-APK
          path: build/android/MouhFail.apk
          if-no-files-found: error
          retention-days: 14
