name: Build Android APK

on:
  push:
    branches: [godot-3d]
    paths:
      - "godot/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Export Godot Android APK
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Prepare Godot export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/
          mkdir -p ~/.config/
          if [ -d /root/.config/godot ]; then
            cp -a /root/.config/godot ~/.config/godot
          fi
          cp -a /root/.local/share/godot/export_templates/4.3.stable ~/.local/share/godot/export_templates/4.3.stable

      - name: Import project resources
        run: godot --headless --path godot --editor --quit

      - name: Build APK
        run: |
          mkdir -p build/android
          godot --headless --verbose --path godot --export-debug "Android" ../build/android/MouhFail.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mouh-Fail-Android-APK
          path: build/android/MouhFail.apk
          if-no-files-found: error
          retention-days: 14
